[project]
name = "montehall-cv"
version = "0.1.0"
description = "Montehall CV pipeline — entity-first game-film extraction: primitive store + perception stages. Runs on spark (DGX Spark GB10, aarch64); NOT part of the k8s app workspace."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.8",
    "pyarrow>=17.0",
    "av>=12.0",
    "pillow>=12.3.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
# GPU/perception deps are provided-or-installed inside the NGC PyTorch
# container on spark (torch ships with the image; rfdetr reuses it).
gpu = [
    "rfdetr>=1.1",
    "supervision>=0.25",
    "segmentation-models-pytorch>=0.3.4",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["montehall_cv"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project]
name = "montehall-cv"
version = "0.1.0"
description = "Entity-first basketball game-film pipeline: primitive store, perception stages, state estimation and evaluation."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.8",
    "pyarrow>=17.0",
    "av>=12.0",
    "pillow>=12.3.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
# GPU/perception deps are provided-or-installed inside the NGC PyTorch
# container (torch ships with the image; rfdetr reuses it).
gpu = [
    "rfdetr>=1.1",
    "supervision>=0.25",
    "segmentation-models-pytorch>=0.3.4",
]

# Model backends for the possession harness (harness/adjudicators.py).
harness = [
    "anthropic>=0.40",
    "typesafe-sdk>=0.7",
]

[dependency-groups]
# typesafe-sdk is here so the suite exercises the real client (mocked transport).
dev = ["pytest>=8.3", "typesafe-sdk>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["montehall_cv"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

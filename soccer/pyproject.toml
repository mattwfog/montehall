[project]
name = "soccerviz"
version = "0.2.0"
description = "Soccer possession analysis, prediction, and evidence review"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
  "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2",
  "shap>=0.48,<0.51",
  "plotly>=6,<7",
  "gradio>=6,<7",
  "joblib>=1.4,<2",
  "av>=14,<17",
  "opencv-python>=4.10,<5",
]

[project.optional-dependencies]
gpu = ["torch>=2.8,<3"]
vision = [
    "gdown>=5,<6",
    "ultralytics>=8.3,<9",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[project.scripts]
soccerviz = "soccerviz.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
